# Every push to main and every PR runs the tests.
# Pushing a tag like v1.2.0 also builds a signed APK and publishes a GitHub release.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $VERSION is not in the form v1.2.3"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Fail rather than fall back to debug keys: a release signed with a
      # different key cannot be installed over the previous version.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets are required"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=zpay
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - run: flutter pub get

      # The tag sets the version; run_number always increases, so each build
      # can be installed as an update to the last.
      - name: Build APK
        run: flutter build apk --release --build-name="${VERSION#v}" --build-number="$GITHUB_RUN_NUMBER"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk "zeropay-$VERSION.apk"
          gh release create "$VERSION" "zeropay-$VERSION.apk" --title "$VERSION" --generate-notes
